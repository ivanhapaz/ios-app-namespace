# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  # ---- Linux: fast, cheap logic tests for the pure-Swift GameCore package ----
  gamecore:
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-tag-gamecore-swiftpm
      - nscloud-git-mirror-5gb
    steps:
      # Namespace's cached checkout (needs the nscloud-git-mirror label above).
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      # --- Swift toolchain -------------------------------------------------
      # Installs Swift on the stock Ubuntu runner. When we later create a
      # custom base image with Swift preinstalled, delete this step and point
      # `runs-on` at that Linux profile — nothing else changes.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      # ---------------------------------------------------------------------

      - name: Cache SwiftPM
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: swiftpm

      - name: Test GameCore
        run: swift test --package-path GameCore

  # ---- macOS: build the full iOS app (SwiftUI + SceneKit) --------------------
  app:
    runs-on: namespace-profile-ivanha
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Configure Namespace cache (Xcode + Homebrew)
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            xcode
            brew

      - name: Confirm runner and Xcode
        run: |
          xcodebuild -version
          uname -m
          sw_vers || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iOS Simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)['devices']
          phones = [d for runtime in data.values() for d in runtime if 'iPhone' in d['name']]
          print(phones[-1]['name'] if phones else 'iPhone 15')
          ")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project TudorCourt.xcodeproj \
            -scheme TudorCourt \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO
